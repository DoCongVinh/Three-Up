<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Bản đồ công khai — Bản đồ Yêu thương Khánh Hòa</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; color: #0f172a; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: #0f766e; color: white; }
    h1 { margin: 0; font-size: 16px; }
    a { color: #ccfbf1; }
    #map { width: 100%; height: calc(100dvh - 55px); }
    #state { font-size: 12px; }
  </style>
</head>
<body>
  <header><h1>📍 Các điểm hỗ trợ đã được xác nhận</h1><span id="state">Đang tải…</span><a href="/">Về trang chính</a></header>
  <div id="map" aria-label="Bản đồ các điểm hỗ trợ Khánh Hòa"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/map-public.js"></script>
</body>
</html>
