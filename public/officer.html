<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Cán bộ — Xác nhận phản hồi thời gian thực</title>
  <style>
    :root { --teal: #0f766e; --slate: #0f172a; --muted: #64748b; --line: #e2e8f0; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, "Segoe UI", sans-serif; background: #f1f5f9; color: var(--slate); }
    header { background: var(--teal); color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    header h1 { font-size: 17px; margin: 0; flex: 1; font-weight: 700; }
    header .who { font-size: 13px; color: #ccfbf1; }
    header a { color: #ccfbf1; font-size: 13px; text-decoration: none; }
    #bell { position: relative; background: rgba(255,255,255,.15); border: 0; color: #fff; font-size: 18px; border-radius: 10px; padding: 6px 12px; cursor: pointer; }
    #bellBadge { position: absolute; top: -6px; right: -6px; background: #dc2626; color: #fff; border-radius: 999px; font-size: 11px; font-weight: 700; padding: 1px 6px; }
    #bellBadge[hidden] { display: none; }
    main { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
    .card { background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 1px 3px rgba(15, 23, 42, .08); margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    input { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
    button { background: var(--teal); color: #fff; border: 0; border-radius: 8px; padding: 9px 14px; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    button.ghost { background: #e2e8f0; color: var(--slate); }
    button.danger { background: #dc2626; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
    .error { color: #b91c1c; font-size: 13px; margin-top: 8px; }
    #list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    #list li { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
    #list li.fresh { border-color: #f59e0b; background: #fffbeb; }
    #list .head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
    #list .who-name { font-weight: 700; }
    #list .content { margin: 8px 0; font-size: 14px; }
    #list .meta { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    #list .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #fef3c7; color: #92400e; }
    .pill.approved { background: #dcfce7; color: #166534; }
    .pill.rejected { background: #fee2e2; color: #991b1b; }
    .badge-emergency { background: #dc2626; color: #fff; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 700; }
    .toast { position: fixed; right: 16px; bottom: 16px; max-width: 360px; background: #0f172a; color: #fff; border-radius: 12px; padding: 12px 14px; font-size: 14px; box-shadow: 0 10px 25px rgba(0,0,0,.25); opacity: 0; transform: translateY(10px); transition: .25s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }
      .toast.urgent {
        background: #b91c1c;
      }

      @media (max-width: 768px) {
        header { position: sticky; top: 0; z-index: 20; padding: 10px 12px; gap: 8px; }
        header h1 { min-width: 100%; font-size: 15px; }
        header .who { flex: 1; min-width: 0; overflow-wrap: anywhere; }
        main { width: 100%; padding: 12px 10px calc(24px + env(safe-area-inset-bottom)); }
        .card { padding: 14px; margin-bottom: 12px; border-radius: 12px; }
        .row > * { min-width: 0; }
        #list li { padding: 11px; overflow-wrap: anywhere; }
        #list .actions button { flex: 1 1 130px; min-height: 44px; }
        .toast { left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); max-width: none; }
        input, button { min-height: 42px; }
      }
    </style>
</head>
<body>
  <header>
    <h1>🧑‍💼 Trang cán bộ xã/phường</h1>
    <span class="who" id="whoami">Chưa đăng nhập</span>
    <button id="bell" title="Thông báo"><span aria-hidden="true">🔔</span><span id="bellBadge" hidden>0</span></button>
    <a href="/citizen.html">Trang người dân →</a>
  </header>

  <main>
    <section class="card" id="loginCard">
      <label for="username">Tên đăng nhập</label>
      <input id="username" autocomplete="username" value="admin">
      <div style="height:10px"></div>
      <label for="password">Mật khẩu</label>
      <input id="password" type="password" autocomplete="current-password" value="Admin@2025">
      <div class="row" style="margin-top:12px">
        <button id="loginBtn">Đăng nhập</button>
        <button class="ghost" id="logoutBtn" hidden>Đăng xuất</button>
      </div>
      <p class="error" id="loginError" hidden></p>
      <p class="meta" style="font-size:12px;color:#64748b">Tài khoản mặc định: admin / Admin@2025 (đổi trong KHANHHOA_ADMIN_PASSWORD).</p>
    </section>

    <section class="card">
      <div class="row" style="justify-content:space-between">
        <strong>Phản hồi chờ xử lý</strong>
        <span style="font-size:12px;color:#64748b" id="socketState">Socket: đang kết nối…</span>
      </div>
      <ul id="list" style="margin-top:12px"><li style="color:#64748b;font-size:13px">Đăng nhập để xem phản hồi của địa bàn phụ trách.</li></ul>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <!-- 1) Client Socket.io do chính server.js phục vụ -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/socket-officer.js"></script>
</body>
</html>
